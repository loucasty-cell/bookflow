services:
  bookflow-paddleocr:
    build:
      context: .
      dockerfile: backend/Dockerfile.ocr
    container_name: bookflow-paddleocr
    ports:
      - "${PADDLEOCR_PORT:-8080}:8080"
    environment:
      - OCR_DEVICE=${PADDLEOCR_DEVICE:-cpu}
      - OCR_PRELOAD_PROFILES=${PADDLEOCR_PRELOAD_PROFILES:-small}
      - OCR_MAX_IMAGE_MB=${PADDLEOCR_MAX_IMAGE_MB:-20}
    volumes:
      - paddleocr_models:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - bookflow-net
    restart: unless-stopped

  bookflow-fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookflow-fastapi
    ports:
      - "8000:8000"
    environment:
      - OCR_MODEL=${OCR_MODEL:-}
      - HF_INFERENCE_URL=${HF_INFERENCE_URL:-https://router.huggingface.co/v1/chat/completions}
      - PADDLEOCR_URL=http://bookflow-paddleocr:8080/ocr
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_API_KEY=${HF_TOKEN:-}
      - ENVIRONMENT=production
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      bookflow-paddleocr:
        condition: service_healthy
    networks:
      - bookflow-net
    restart: unless-stopped

volumes:
  paddleocr_models:
    driver: local

networks:
  bookflow-net:
    driver: bridge
